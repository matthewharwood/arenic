[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# `ui_picking` is NOT in Bevy's default feature set; it enables the UI picking
# backend that drives `Pointer<…>` observer events (and `Interaction`) on UI nodes.
bevy = { version = "0.18.1", features = ["ui_picking"] }
# The shared game crate. Both binaries (the game and the storybook) depend on it;
# it never depends on them, so game pieces live here and are reused, not copied.
arenic_game = { path = "crates/arenic_game" }
# Serialization for the versioned encounter score files (`arenic_game::encounter`).
# The same versions Bevy already locks, so they add no duplicate builds.
serde = { version = "1", features = ["derive"] }
ron = "0.12"

# Workspace-wide lint config. Each crate opts in with `[lints] workspace = true`.
# These two clippy lints fire constantly on idiomatic Bevy systems — big `Query`
# tuples and many system params — so we relax them once here instead of sprinkling
# `#[allow(...)]` on every system. A named lint outranks the `-D warnings` group,
# so CI's `cargo clippy -- -D warnings` still honours these allows.
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

# Abort on panic instead of unwinding. For a game this is the idiomatic choice:
# it produces a smaller, faster binary and — crucially here — removes the giant
# stack-unwinding (`__eh_frame`) tables that overflow macOS's 16 MB compact-unwind
# limit and trigger the linker warning. Panics still print their message/backtrace.
# Profiles must live in the workspace root; they apply to every member crate.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false

# Repo automation, run via the `cargo xtask` alias (.cargo/config.toml). Lives in
# the workspace but is excluded from the clippy gate (it's a dev tool, not shipped
# code) — see .github/workflows/clippy.yml.
[dependencies]
anyhow = "1.0.102"
# Pure-Rust SVG rasterizer — no librsvg / system libraries, reproducible output.
resvg = "0.47.0"
usvg = "0.47.0"
tiny-skia = "0.12.0"
# Pure-Rust HTTPS (rustls by default; no system OpenSSL).
ureq = "3.3.0"

[lints]
workspace = true
